<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <rect width="160" height="36" fill="#0B0F19"/>
  <!-- Brand Mark (32x32), reversed to a single ink on the dark field -->
  <g transform="translate(2, 2)">
    <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" stroke="#F8FAFC" stroke-width="2" fill="#0B0F19"/>
    <path d="M16 7L23 11V21L16 25L9 21V11L16 7Z" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
    <circle cx="16" cy="16" r="3" fill="#F8FAFC"/>
    <line x1="16" y1="2" x2="16" y2="7" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="28" y1="9" x2="23" y2="11" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="28" y1="23" x2="23" y2="21" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="16" y1="30" x2="16" y2="25" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="4" y1="23" x2="9" y2="21" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="4" y1="9" x2="9" y2="11" stroke="#F8FAFC" stroke-width="2"/>
  </g>
  <!-- Wordmark 'Aegis' (12px gap after mark at x=46) -->
  <text x="46" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.04em" fill="#F8FAFC">Aegis</text>
  <!-- 'MCP' Monospace Badge at x=106, outlined with no fill -->
  <g transform="translate(106, 8)">
    <rect width="44" height="20" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">MCP</text>
  </g>
</svg>
